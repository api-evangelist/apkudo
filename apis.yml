aid: apkudo
name: Apkudo
description: 'Apkudo is a Baltimore, Maryland based company operating the Device Passport
  Platform for the connected device supply chain, combining software, AI and advanced
  robotics to capture trusted data at every stage of a device''s life. The platform
  spans Launch (device certification and testing), Trade In (consumer trade-in and
  diagnostics), Recover (enterprise IT asset recovery), Process (automated functional
  and cosmetic grading) and Monetize (liquidation and resale routing), and is built
  on Device Passport, Device AI and DeviceOS. Apkudo sells a Full Automation Line,
  a Standalone Automation Unit and a Diagnostic SDK that partners embed into consumer
  and retail applications; integrations with customer systems are delivered privately
  under commercial agreement rather than through a public developer program.'
